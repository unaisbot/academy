
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TBARC Academy</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">T</span>
        <span>
          <strong>TBARC ACADEMY</strong>
          <small>Learning &amp; Research</small>
        </span>
      </a>

      <a class="back-home" href="index.html">← Home</a>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">

      <span class="brand-mark large">T</span>

      <span class="section-label" id="loginLabel">
        SECURE LOGIN
      </span>

      <h1 id="loginTitle">Welcome back</h1>

      <p id="loginDescription">
        Sign in using your registered Google account.
      </p>

      <button class="button google-button" id="googleSignIn" type="button">
        <span class="google-g">G</span>
        Continue with Google
      </button>

      <p id="loginMessage" class="login-help" aria-live="polite"></p>

      <small class="secure-note" id="loginSecureNote">
        Access is restricted to authorised users.
      </small>

    </div>
  </main>

  <script type="module" src="assets/js/login.js"></script>

</body>
</html>
