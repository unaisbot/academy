<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | TBARC Academy</title>

  <meta name="theme-color" content="#123f32">
  <meta name="description" content="Secure login to TBARC Academy learning platform.">

  <!-- TBARC Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/images/favicon.png"
  >

  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-wrap">

      <a class="brand" href="index.html">

        <img
          src="/assets/images/logo.png"
          alt="TBARC Academy Logo"
          class="brand-logo"
          style="width:48px;height:48px;object-fit:contain;"
        >

        <span>
          <strong>TBARC ACADEMY</strong>
          <small>Learning &amp; Research</small>
        </span>

      </a>

      <a class="back-home" href="index.html">
        ← Home
      </a>

    </div>
  </header>

  <!-- Login Section -->
  <main class="login-main">

    <div class="login-card">

      <!-- Large TBARC Logo -->
      <img
        src="/assets/images/logo.png"
        alt="TBARC Academy"
        class="login-logo"
        style="width:90px;height:90px;object-fit:contain;display:block;margin-bottom:28px;"
      >

      <span class="section-label" id="loginLabel">
        SECURE LOGIN
      </span>

      <h1 id="loginTitle">
        Welcome back
      </h1>

      <p id="loginDescription">
        Sign in using your registered Google account.
      </p>

      <!-- Google Sign In -->
      <button
        class="button google-button"
        id="googleSignIn"
        type="button"
      >
        <span class="google-g">G</span>
        Continue with Google
      </button>

      <!-- Login Status -->
      <p
        id="loginMessage"
        class="login-help"
        aria-live="polite"
      ></p>

      <small
        class="secure-note"
        id="loginSecureNote"
      >
        Access is restricted to authorised users.
      </small>

    </div>

  </main>

  <!-- Existing Login JavaScript -->
  <script
    type="module"
    src="assets/js/login.js"
  ></script>

</body>
</html>
